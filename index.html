<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社会ニーズ発見レーダー</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Market Need Radar</p>
        <h1>社会ニーズ発見レーダー</h1>
        <p class="lead">社会の不満や非効率を記録し、事業候補として見返せるようにします。</p>
      </div>
    </header>

    <main class="layout">
      <section class="card form-card" aria-labelledby="form-title">
        <h2 id="form-title">課題を登録する</h2>
        <p class="hint">タイトルだけは必須です。分からない項目は空欄のまま保存できます。</p>
        <form id="need-form" novalidate>
          <input type="hidden" id="need-id">

          <label for="title">課題のタイトル <span class="required">必須</span></label>
          <input id="title" name="title" type="text" autocomplete="off" required placeholder="例：部活動の予定共有が分かりにくい">

          <label for="description">課題の詳しい内容</label>
          <textarea id="description" name="description" rows="5" placeholder="どんな場面で、何に困っているかを書きます"></textarea>

          <label for="affected">困っている人や企業</label>
          <input id="affected" name="affected" type="text" placeholder="例：部員、保護者、顧問の先生">

          <label for="payer">支払者候補</label>
          <input id="payer" name="payer" type="text" placeholder="例：学校、保護者、地域クラブ">

          <label for="source">情報源</label>
          <input id="source" name="source" type="text" placeholder="例：友人から聞いた話、SNS、レビューURL">

          <p id="form-message" class="message" role="status" aria-live="polite"></p>

          <div class="button-row">
            <button type="submit" class="primary-button">登録する</button>
            <button type="button" id="cancel-edit" class="secondary-button" hidden>編集をやめる</button>
          </div>
        </form>
      </section>

      <section class="card list-card" aria-labelledby="list-title">
        <div class="list-header">
          <div>
            <h2 id="list-title">登録した課題</h2>
            <p id="need-count" class="hint">0件</p>
          </div>
        </div>

        <form id="external-candidates-form" class="external-import" aria-labelledby="external-import-title">
          <h3 id="external-import-title">外部から課題候補を取得</h3>
          <p class="hint">GitHub IssuesとHacker Newsから保存前の候補を取得し、確認したものだけ課題として保存します。</p>

          <label for="external-source">情報源</label>
          <select id="external-source" name="external-source">
            <option value="github_issues">GitHub Issues</option>
            <option value="hacker_news">Hacker News</option>
          </select>

          <label for="external-query">入力内容</label>
          <div class="inline-form">
            <input id="external-query" name="external-query" type="text" inputmode="search" placeholder="GitHub: owner/repo またはURL / HN: 検索語">
            <button type="submit" id="external-fetch-button" class="secondary-button">候補を取得</button>
          </div>
          <p id="external-candidates-message" class="message" role="status" aria-live="polite"></p>
        </form>

        <section class="candidate-section" aria-labelledby="candidate-list-title">
          <h3 id="candidate-list-title">保存前の課題候補</h3>
          <div id="candidates-list" class="candidates-list" aria-live="polite"></div>
        </section>

        <div id="needs-list" class="needs-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
